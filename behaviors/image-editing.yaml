bundle:
  name: image-editing-behavior
  version: 2.0.0
  description: Self-contained sequential image editing with automatic high-fidelity inputs, approval checkpoints, policy preflight, and final-artifact QA

tools:
  - module: tool-imagen
    source: ../modules/tool-imagen
    config:
      mode: mcp
      default_provider: auto
      default_openai_size: "1536x1024"
      default_gemini_size: "1K"

agents:
  include:
    - imagen:image-editor

context:
  include:
    - imagen:context/imagen-awareness.md
    - imagen:context/image-production-policy.md
