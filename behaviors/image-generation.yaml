bundle:
  name: image-generation-behavior
  version: 2.0.0
  description: Self-contained adaptive image generation with direction, prompt engineering, policy preflight, visual QA, and provider tools

tools:
  - module: tool-imagen
    source: ../modules/tool-imagen
    config:
      mode: mcp
      default_provider: auto
      default_openai_size: "1536x1024"
      default_gemini_size: "1K"
  - module: tool-skills
    source: git+https://github.com/microsoft/amplifier-bundle-skills@99b0bc176ed8f47a1ab18a7c651b657be2a15402#subdirectory=modules/tool-skills
    config:
      # Plain local paths resolve from the consumer cwd, not this bundle. Pin
      # the self-source to the same immutable release as the behavior.
      skills:
        - "git+https://github.com/michaeljabbour/amplifier-bundle-imagen@v2.0.0#subdirectory=skills"
      visibility:
        enabled: true
        inject_role: "user"
        max_skills_visible: 20
        ephemeral: true
        priority: 20

agents:
  include:
    - imagen:image-director
    - imagen:image-prompt-engineer
    - imagen:image-researcher

context:
  include:
    - imagen:context/imagen-awareness.md
    - imagen:context/image-production-policy.md
