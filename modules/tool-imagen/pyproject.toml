[project]
name = "amplifier-module-tool-imagen"
version = "2.0.0"
description = "Amplifier adapter that exposes the reviewed imagen-mcp tool contract through the official MCP SDK."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Michael Jabbour" },
]

dependencies = [
    "amplifier-core>=1.6,<2",
    "mcp>=1.26.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.9.0",
]

[project.entry-points."amplifier.modules"]
tool-imagen = "amplifier_module_tool_imagen:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_imagen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
